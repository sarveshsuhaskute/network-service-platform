name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, fault-injection and security tests
        run: python tests/run_tests.py
      - name: Benchmark smoke run (echo latency + failure detection)
        run: python bench/run_benchmarks.py --quick --only e1,e7
